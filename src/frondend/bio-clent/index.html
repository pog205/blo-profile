
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/pog-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POG - Craft Your Digital Identity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: '#0F111A',
              card: '#1A1D2B',
              primary: '#00d4ff',
              accent: '#bef264',
              muted: '#94a3b8',
              // Nexus Auth Theme Colors
              'bg-dark': '#18181b',
              'surface-dark': '#27272a',
              'border-dark': '#3f3f46',
              'text-secondary': '#a1a1aa',
              'nexus-teal': '#06b6d4',
              'nexus-lime': '#bef264',
            },
            fontFamily: {
              sans: ['Space Grotesk', 'sans-serif'],
            },
            backgroundImage: {
              'grid-pattern': "linear-gradient(to right, #2A2E3B 1px, transparent 1px), linear-gradient(to bottom, #2A2E3B 1px, transparent 1px)",
              'gradient-digital': 'linear-gradient(to right, #06b6d4, #bef264)',
            }
          }
        }
      }
    </script>
    <style>
      .glass-panel {
        background: rgba(15, 17, 26, 0.65);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .neon-text {
        background: linear-gradient(to right, #00d4ff, #bef264);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .grid-bg {
        background-size: 40px 40px;
        mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
      }
      body {
        font-family: 'Space Grotesk', 'Inter', sans-serif;
        background-color: #0F111A;
        color: white;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #2a2a2a;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3a3a3a;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
